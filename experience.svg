<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 290" width="1000" height="290" role="img" aria-labelledby="t d">
  <title id="t">Experience</title>
  <desc id="d">Timeline: Associate Product Designer, AppsForBharat, Apr 2026 to now; Product Design Intern, PharmEasy, Dec 2025 to Apr 2026; UX Designer Intern, Techolution, Feb to Nov 2025; UX &amp; Web Designer, Freelance, May to Jul 2024; Co-founder, PRYD Studios, Dec 2022 to Aug 2023.</desc>
  <defs>
    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5B8CFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8FB0FF" stop-opacity="1"/>
      <stop offset="1" stop-color="#5B8CFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="prog" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5B8CFF"/>
      <stop offset="1" stop-color="#3B5BDB" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="glow" cx="12%" cy="0%" r="80%">
      <stop offset="0" stop-color="#3B6CF0" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#3B6CF0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#FFFFFF" fill-opacity="0.05"/>
    </pattern>
    <clipPath id="round"><rect width="1000" height="290" rx="18"/></clipPath>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .draw { stroke-dasharray: 860; stroke-dashoffset: 860; animation: draw 2.6s cubic-bezier(.6,.1,.2,1) .2s forwards; }
    .pop { opacity: 0; animation: pop .7s cubic-bezier(.2,.8,.2,1) forwards; }
    .ring { transform-box: fill-box; transform-origin: center; animation: ring 2.2s ease-out infinite; }
    .runner { animation: run 5.5s linear 3.2s infinite; opacity: 0; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes ring { 0% { transform: scale(1); opacity: 0.9; } 100% { transform: scale(2.4); opacity: 0; } }
    @keyframes run { 0% { transform: translateX(0); opacity: 0; } 8% { opacity: 1; } 92% { opacity: 1; } 100% { transform: translateX(800px); opacity: 0; } }
  </style>

  <g clip-path="url(#round)">
    <rect width="1000" height="290" fill="#0E0F13"/>
    <rect width="1000" height="290" fill="url(#grid)"/>
    <rect width="1000" height="290" fill="url(#glow)"/>
  </g>
  <rect x="0.5" y="0.5" width="999" height="289" rx="18" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <line x1="70" y1="150" x2="930" y2="150" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="2" stroke-linecap="round"/>
  <line class="draw" x1="70" y1="150" x2="930" y2="150" stroke="url(#prog)" stroke-width="2.5" stroke-linecap="round"/>
  <rect class="runner" x="70" y="148.5" width="60" height="3" rx="1.5" fill="url(#trace)"/>

    <g class="pop" style="animation-delay:0.50s">
      <line x1="140" y1="140" x2="140" y2="104" stroke="#FFFFFF" stroke-opacity="0.16" stroke-dasharray="2 4" stroke-linecap="round"/>
      <circle class="ring" cx="140" cy="150" r="9" fill="none" stroke="#5B8CFF" stroke-width="2"/>
      <circle cx="140" cy="150" r="7" fill="#5B8CFF" stroke="#5B8CFF" stroke-width="2.5"/>
      <text class="mono" x="140" y="52" font-size="12" fill="#7C8499" text-anchor="middle">Apr 2026 to now</text>
      <text class="sans" x="140" y="74" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Associate Product Designer</text>
      <text class="sans" x="140" y="94" font-size="13.5" font-weight="600" fill="#8FB0FF" text-anchor="middle">AppsForBharat</text>
    </g>
    <g class="pop" style="animation-delay:0.85s">
      <line x1="320" y1="160" x2="320" y2="196" stroke="#FFFFFF" stroke-opacity="0.16" stroke-dasharray="2 4" stroke-linecap="round"/>
      
      <circle cx="320" cy="150" r="7" fill="#0E0F13" stroke="#5B8CFF" stroke-width="2.5"/>
      <text class="mono" x="320" y="218" font-size="12" fill="#7C8499" text-anchor="middle">Dec 2025 to Apr 2026</text>
      <text class="sans" x="320" y="240" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Product Design Intern</text>
      <text class="sans" x="320" y="260" font-size="13.5" font-weight="600" fill="#8FB0FF" text-anchor="middle">PharmEasy</text>
    </g>
    <g class="pop" style="animation-delay:1.20s">
      <line x1="500" y1="140" x2="500" y2="104" stroke="#FFFFFF" stroke-opacity="0.16" stroke-dasharray="2 4" stroke-linecap="round"/>
      
      <circle cx="500" cy="150" r="7" fill="#0E0F13" stroke="#5B8CFF" stroke-width="2.5"/>
      <text class="mono" x="500" y="52" font-size="12" fill="#7C8499" text-anchor="middle">Feb to Nov 2025</text>
      <text class="sans" x="500" y="74" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">UX Designer Intern</text>
      <text class="sans" x="500" y="94" font-size="13.5" font-weight="600" fill="#8FB0FF" text-anchor="middle">Techolution</text>
    </g>
    <g class="pop" style="animation-delay:1.55s">
      <line x1="680" y1="160" x2="680" y2="196" stroke="#FFFFFF" stroke-opacity="0.16" stroke-dasharray="2 4" stroke-linecap="round"/>
      
      <circle cx="680" cy="150" r="7" fill="#0E0F13" stroke="#5B8CFF" stroke-width="2.5"/>
      <text class="mono" x="680" y="218" font-size="12" fill="#7C8499" text-anchor="middle">May to Jul 2024</text>
      <text class="sans" x="680" y="240" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">UX &amp; Web Designer</text>
      <text class="sans" x="680" y="260" font-size="13.5" font-weight="600" fill="#8FB0FF" text-anchor="middle">Freelance</text>
    </g>
    <g class="pop" style="animation-delay:1.90s">
      <line x1="860" y1="140" x2="860" y2="104" stroke="#FFFFFF" stroke-opacity="0.16" stroke-dasharray="2 4" stroke-linecap="round"/>
      
      <circle cx="860" cy="150" r="7" fill="#0E0F13" stroke="#5B8CFF" stroke-width="2.5"/>
      <text class="mono" x="860" y="52" font-size="12" fill="#7C8499" text-anchor="middle">Dec 2022 to Aug 2023</text>
      <text class="sans" x="860" y="74" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Co-founder</text>
      <text class="sans" x="860" y="94" font-size="13.5" font-weight="600" fill="#8FB0FF" text-anchor="middle">PRYD Studios</text>
    </g>
</svg>
