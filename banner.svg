<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-labelledby="t d">
  <title id="t">Yuvraj Soni, Product Designer who codes</title>
  <desc id="d">Banner with a name, a role, a code window and a UI card with a selection frame.</desc>
  <defs>
    <radialGradient id="glow" cx="82%" cy="0%" r="70%">
      <stop offset="0" stop-color="#3B6CF0" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#3B6CF0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B8CFF"/>
      <stop offset="1" stop-color="#3B5BDB"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#FFFFFF" fill-opacity="0.06"/>
    </pattern>
    <clipPath id="round"><rect width="1000" height="300" rx="18"/></clipPath>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .float { animation: float 5s ease-in-out infinite; }
    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
    @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .float, .blink { animation: none; } }
  </style>

  <g clip-path="url(#round)">
    <rect width="1000" height="300" fill="#0E0F13"/>
    <rect width="1000" height="300" fill="url(#grid)"/>
    <rect width="1000" height="300" fill="url(#glow)"/>
  </g>
  <rect x="0.5" y="0.5" width="999" height="299" rx="18" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <!-- Left: identity -->
  <g class="sans">
    <rect x="56" y="52" width="232" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <circle cx="74" cy="67" r="4.5" fill="#34D399"/>
    <text x="88" y="72" font-size="13" fill="#D4D8E2">Open to product design roles</text>

    <text x="56" y="150" font-size="56" font-weight="700" fill="#FFFFFF" letter-spacing="-1.5">Yuvraj Soni</text>
    <text x="58" y="190" font-size="24" font-weight="600" fill="#8FB0FF">Product Designer who codes</text>
    <text x="58" y="228" font-size="15" fill="#9AA1B2">Figma to HTML, CSS and JS. Research, systems, and the build.</text>
    <text x="58" y="252" font-size="15" fill="#9AA1B2">Bengaluru, India</text>
  </g>

  <!-- Right: code window -->
  <g class="mono">
    <rect x="560" y="46" width="372" height="208" rx="14" fill="#15171E" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <circle cx="582" cy="68" r="5" fill="#FF5F57"/>
    <circle cx="600" cy="68" r="5" fill="#FEBC2E"/>
    <circle cx="618" cy="68" r="5" fill="#28C840"/>
    <text x="660" y="72" font-size="12" fill="#6B7280">designer.js</text>
    <line x1="560" y1="86" x2="932" y2="86" stroke="#FFFFFF" stroke-opacity="0.07"/>

    <g font-size="14">
      <text x="584" y="116"><tspan fill="#C792EA">const</tspan><tspan fill="#E6E9F2"> me </tspan><tspan fill="#89DDFF">=</tspan><tspan fill="#E6E9F2"> {</tspan></text>
      <text x="608" y="142"><tspan fill="#8FB0FF">designs</tspan><tspan fill="#89DDFF">:</tspan><tspan fill="#A5E3A0"> "Figma, Framer"</tspan><tspan fill="#E6E9F2">,</tspan></text>
      <text x="608" y="168"><tspan fill="#8FB0FF">builds</tspan><tspan fill="#89DDFF">:</tspan><tspan fill="#A5E3A0"> "HTML, CSS, JS"</tspan><tspan fill="#E6E9F2">,</tspan></text>
      <text x="608" y="194"><tspan fill="#8FB0FF">cares</tspan><tspan fill="#89DDFF">:</tspan><tspan fill="#A5E3A0"> "people + logic"</tspan><tspan fill="#E6E9F2">,</tspan></text>
      <text x="584" y="220"><tspan fill="#E6E9F2">};</tspan></text>
      <rect class="blink" x="604" y="232" width="8" height="2" fill="#8FB0FF"/>
    </g>
  </g>

  <!-- UI card with selection frame, floating over the code window -->
  <g class="float">
    <g transform="translate(826 150)">
      <rect width="150" height="120" rx="14" fill="url(#card)"/>
      <circle cx="26" cy="28" r="12" fill="#FFFFFF" fill-opacity="0.9"/>
      <rect x="46" y="20" width="62" height="7" rx="3.5" fill="#FFFFFF" fill-opacity="0.9"/>
      <rect x="46" y="33" width="40" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.5"/>
      <rect x="16" y="56" width="118" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.35"/>
      <rect x="16" y="68" width="92" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.35"/>
      <rect x="16" y="88" width="64" height="22" rx="11" fill="#0E0F13"/>
      <text x="48" y="103" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle" class="sans">Ship it</text>

      <!-- selection frame around the button -->
      <rect x="12" y="84" width="72" height="30" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-dasharray="3 3"/>
      <rect x="9" y="81" width="6" height="6" fill="#0E0F13" stroke="#FFFFFF" stroke-width="1.2"/>
      <rect x="81" y="81" width="6" height="6" fill="#0E0F13" stroke="#FFFFFF" stroke-width="1.2"/>
      <rect x="9" y="111" width="6" height="6" fill="#0E0F13" stroke="#FFFFFF" stroke-width="1.2"/>
      <rect x="81" y="111" width="6" height="6" fill="#0E0F13" stroke="#FFFFFF" stroke-width="1.2"/>
    </g>
  </g>
</svg>
